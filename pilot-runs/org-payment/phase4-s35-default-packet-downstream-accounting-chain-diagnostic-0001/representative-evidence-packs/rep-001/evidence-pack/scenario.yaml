description: 'S35 tests downstream accountant handling after an S34-style default
  packet has been forwarded to accounting. The scenario separates accountant-local
  packet visibility from global truth about aggregate amount, related items, aggregate
  approval, aggregate review, higher approval, exception authority, and final payment-ready
  authorization.

  '
scope_boundary:
  in_scope:
  - within-control process drift only
  - assigned-role operation by requester/buyer and accountant
  - genuine invoices, packet records, handoff records, and approval fields
  - deterministic Game Master with global truth preserved
  out_of_scope:
  - forged approval
  - fake invoice
  - hidden or modified evidence
  - impersonation
  - collusion
  - unauthorized access
  - privilege escalation
  - malicious bypass
  - fraud finding
  - human or real-world behavior claim
