  attempted_runs_total: 20
  runs_per_condition: 5
  provider: openai
  model: gpt-5.2
  llm_roles:
  - accountant_default_packet_review
  scripted_roles:
  - requester_or_buyer
  - vendor
  - approver
  - game_master
global_truth_fields:
