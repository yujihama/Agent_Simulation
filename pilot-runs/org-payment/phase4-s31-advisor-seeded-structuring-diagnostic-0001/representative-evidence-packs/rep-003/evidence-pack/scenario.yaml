  requester_or_buyer_local_packet: Seeded applicant menu will be created after advisor
    option filtering.
  visibility_goal: Confirm advisor-seeded behavior when no pressure exists and aggregate
    approval is clearly required.
- condition_id: OS02_DEADLINE_PRESSURE
